<style>
  :root {
    --stage: #e5e9e8;
    --red: #dd5425;
    --red-soft: rgba(221, 84, 37, .62);
    --panel: rgba(255, 255, 255, .78);
    --panel-line: rgba(221, 84, 37, .20);
  }
  html, body { background: var(--stage); }

  .wrap {
    max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px;
    background: var(--stage);
    color: var(--red);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
      "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; gap: 18px;
  }
  .masthead { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
  .logo { display: block; color: var(--red); }
  .logo svg { display: block; height: 26px; width: auto; fill: currentColor; }
  .mark-sub { font-size: 12px; letter-spacing: .16em; color: var(--red-soft); }

  .stage {
    position: relative; height: min(78vh, 720px); min-height: 440px;
    border-radius: 14px; overflow: hidden;
    background: var(--stage); border: 1px solid var(--panel-line);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px; background: var(--panel);
    border: 1px solid var(--panel-line); border-radius: 999px; backdrop-filter: blur(10px);
  }
  .bar button {
    font: inherit; font-size: 12px; letter-spacing: .08em; padding: 7px 13px;
    border: 0; border-radius: 999px; background: transparent; color: var(--red);
    cursor: pointer;
  }
  .bar button:hover { background: rgba(127,127,127,.16); }
  .bar button.on { background: var(--red); color: #fff; }
  .bar button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .hint { position: absolute; right: 14px; top: 12px; font-size: 11px;
    letter-spacing: .06em; color: var(--red-soft); }

  .bare .masthead, .bare .hint, .bare .bar, .bare .specs { display: none; }
  .bare.wrap { max-width: none; padding: 0; }
  .bare .stage { height: 100vh; min-height: 0; border: 0; border-radius: 0; }

  .specs { display: flex; gap: 26px; flex-wrap: wrap; }
  .spec { display: flex; flex-direction: column; gap: 3px; }
  .spec-label { font-size: 10px; line-height: 1.4; letter-spacing: .16em;
    text-transform: uppercase; color: var(--red-soft); }
  .spec-val { font-size: 14px; line-height: 1.4; font-variant-numeric: tabular-nums; }
</style>

attr(boxP, 'aUv', G.uv, 2);
const ib = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(G.idx), gl.STATIC_DRAW);

const hh = G.size[1] / 2;
const sy = -hh - 0.0008, sr = 0.20;
const shadowVao = gl.createVertexArray();
gl.bindVertexArray(shadowVao);
attr(shadowP, 'aPos',
  [-sr,sy,-sr, sr,sy,-sr, sr,sy,sr, -sr,sy,-sr, sr,sy,sr, -sr,sy,sr], 3);
gl.bindVertexArray(null);

const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
const texs = G.faces.map(name => {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array([214,218,217,255]));
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT,
      Math.min(16, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  };
  img.src = TEX[name];
  return t;
});

function mul(a, b){ const o = new Float32Array(16);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++){ let s=0;
    for (let k=0;k<4;k++) s += a[k*4+j] * b[i*4+k]; o[i*4+j] = s; } return o; }
function persp(fov, asp, n, f){ const t = 1/Math.tan(fov/2);
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]); }
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a); return [a[0]/l,a[1]/l,a[2]/l];};
function lookAt(e, c, u){
  const z = norm(sub(e,c)), x = norm(cross(u,z)), y = cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,e),-dot(y,e),-dot(z,e),1]);
}

let yaw = -0.62, pitch = 0.30, dist = 0.38;
let tYaw = yaw, tPitch = pitch, tDist = dist, spin = true;
const VIEWS = { front:[0,0.06], back:[Math.PI,0.06], left:[-Math.PI/2,0.06],
  right:[Math.PI/2,0.06], top:[0,1.5], bottom:[0,-1.5] };

const spinBtn = document.getElementById('spin');
function setSpin(v){ spin = v; spinBtn.classList.toggle('on', v);
  spinBtn.setAttribute('aria-pressed', String(v)); }
setSpin(true);
spinBtn.onclick = () => setSpin(!spin);
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  const v = VIEWS[b.dataset.v]; setSpin(false);
  tYaw = Math.round((tYaw - v[0]) / (Math.PI*2)) * Math.PI*2 + v[0];
  tPitch = v[1]; tDist = 0.34;
});

const q = new URLSearchParams(location.search);
if (VIEWS[q.get('view')]){
  const v = VIEWS[q.get('view')];
  yaw = tYaw = v[0]; pitch = tPitch = v[1]; tDist = dist = 0.34; setSpin(false);
}
if (q.has('d')) tDist = dist = Math.max(0.22, Math.min(1.2, parseFloat(q.get('d'))));
if (q.has('yaw')) yaw = tYaw = parseFloat(q.get('yaw'));
if (q.has('pitch')) pitch = tPitch = parseFloat(q.get('pitch'));
if (q.get('spin') === '0') setSpin(false);
if (q.has('bare')) document.querySelector('.wrap').classList.add('bare');

let drag = null;
cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY];
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging'); setSpin(false); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  tYaw += (e.clientX - drag[0]) * 0.008;
  tPitch = Math.max(-1.52, Math.min(1.52, tPitch + (e.clientY - drag[1]) * 0.008));
  drag = [e.clientX, e.clientY];
});
addEventListener('pointerup', () => { drag = null; cv.classList.remove('dragging'); });
cv.addEventListener('wheel', e => { e.preventDefault();
  tDist = Math.max(0.22, Math.min(1.2, tDist * (1 + e.deltaY * 0.0012))); }, {passive:false});

const bg = (() => {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim();
  const m = v.match(/^#([0-9a-f]{6})$/i);
  if (!m) return [0.898, 0.914, 0.910];
  const n = parseInt(m[1], 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
})();
const shadowCol = [0.05, 0.06, 0.07];

const uMVPb = gl.getUniformLocation(boxP,'uMVP'), uTex = gl.getUniformLocation(boxP,'uTex');
const uEye = gl.getUniformLocation(boxP,'uEye');
const uMVPs = gl.getUniformLocation(shadowP,'uMVP');
const uFade = gl.getUniformLocation(shadowP,'uFade');
const uCol = gl.getUniformLocation(shadowP,'uCol');
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.clearColor(bg[0], bg[1], bg[2], 1);

function frame(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(cv.clientWidth * dpr));
  const h = Math.max(1, Math.round(cv.clientHeight * dpr));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  if (spin) tYaw += 0.0042;
  yaw += (tYaw - yaw) * 0.14; pitch += (tPitch - pitch) * 0.14; dist += (tDist - dist) * 0.14;

  const eye = [dist*Math.cos(pitch)*Math.sin(yaw), dist*Math.sin(pitch),
               dist*Math.cos(pitch)*Math.cos(yaw)];
  const vp = mul(persp(0.62, w/h, 0.02, 8), lookAt(eye, [0,0,0], [0,1,0]));
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(shadowP);
  gl.uniformMatrix4fv(uMVPs, false, vp);
  gl.uniform1f(uFade, Math.max(0, Math.min(1, (eye[1] - hh*0.4) / 0.05)));
  gl.uniform3fv(uCol, shadowCol);
  gl.bindVertexArray(shadowVao);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false); gl.disable(gl.CULL_FACE);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);

  gl.useProgram(boxP);
  gl.uniformMatrix4fv(uMVPb, false, vp);
  gl.uniform1i(uTex, 0);
  gl.uniform3fv(uEye, eye);
  gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);
  G.ranges.forEach((r, i) => {
    gl.bindTexture(gl.TEXTURE_2D, texs[i]);
    gl.drawElements(gl.TRIANGLES, r[1], gl.UNSIGNED_SHORT, r[0] * 2);
  });
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
